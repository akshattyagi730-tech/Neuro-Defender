services:
  # ─── 1. Backend Web Service ──────────────────────────────
  - type: web
    name: neurodefender-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ND_ALLOWED_ORIGINS
        value: "*"
      - key: ND_RATE_LIMIT_RPS
        value: 10.0
      - key: ND_RATE_LIMIT_BURST
        value: 20

  # ─── 2. Frontend Static Site ─────────────────────────────
  - type: web
    name: neurodefender-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          name: neurodefender-backend
          type: web
          property: host
